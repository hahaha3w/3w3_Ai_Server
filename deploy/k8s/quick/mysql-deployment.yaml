apiVersion: apps/v1
kind: Deployment
metadata:
  namespace: ai-biography
  annotations:
    kompose.cmd: kompose convert -f quickstart-compose.yaml -o quick/
    kompose.version: 1.35.0 (HEAD)
  labels:
    io.kompose.service: mysql
  name: mysql
spec:
  replicas: 1
  selector:
    matchLabels:
      io.kompose.service: mysql
  strategy:
    type: Recreate
  template:
    metadata:
      annotations:
        kompose.cmd: kompose convert -f quickstart-compose.yaml -o quick/
        kompose.version: 1.35.0 (HEAD)
      labels:
        io.kompose.service: mysql
    spec:
      containers:
        - env:
            - name: MYSQL_ROOT_PASSWORD
              value: ioTnq2Tqq8PnQoGU@UnGUzF7_8*H2Hv4KQcg-G_ho6DCDW@schgk-NLXKGM-ThWD*wq6Pt_Un-FumsTfoBzH.Bha7ztta!-yAqYi
          image: mysql:8
          name: mysql
          ports:
            - containerPort: 3306
              protocol: TCP
          volumeMounts:
            - mountPath: /docker-entrypoint-initdb.d/init.sql
              name: mysql-cm0
              subPath: init.sql
      restartPolicy: Always
      volumes:
        - configMap:
            items:
              - key: init.sql
                path: init.sql
            name: mysql-cm0
          name: mysql-cm0
