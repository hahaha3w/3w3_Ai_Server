apiVersion: apps/v1
kind: Deployment
metadata:
  namespace: ai-biography
  annotations:
    kompose.cmd: kompose convert -f quickstart-compose.yaml -o quick/
    kompose.version: 1.35.0 (HEAD)
  labels:
    io.kompose.service: redis
  name: redis
spec:
  replicas: 1
  selector:
    matchLabels:
      io.kompose.service: redis
  template:
    metadata:
      annotations:
        kompose.cmd: kompose convert -f quickstart-compose.yaml -o quick/
        kompose.version: 1.35.0 (HEAD)
      labels:
        io.kompose.service: redis
    spec:
      containers:
        - args:
            - redis-server
            - --requirepass
            - F7_8*H2Hv4KQcg-G_ho6DCDW@schgk-NLXKGM-ThWD*wq6
          image: redis:latest
          name: redis
          ports:
            - containerPort: 6379
              protocol: TCP
      restartPolicy: Always
