apiVersion: apps/v1
kind: Deployment
metadata:
  namespace: ai-biography
  annotations:
    kompose.cmd: kompose convert -f quickstart-compose.yaml -o quick/
    kompose.version: 1.35.0 (HEAD)
  labels:
    io.kompose.service: consul
  name: consul
spec:
  replicas: 1
  selector:
    matchLabels:
      io.kompose.service: consul
  template:
    metadata:
      annotations:
        kompose.cmd: kompose convert -f quickstart-compose.yaml -o quick/
        kompose.version: 1.35.0 (HEAD)
      labels:
        io.kompose.service: consul
    spec:
      containers:
        - image: consul:1.15.4
          name: consul
          ports:
            - containerPort: 8500
              protocol: TCP
      restartPolicy: Always
