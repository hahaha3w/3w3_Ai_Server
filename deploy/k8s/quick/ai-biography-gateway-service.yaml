apiVersion: v1
kind: Service
metadata:
  namespace: ai-biography
  annotations:
    kompose.cmd: kompose convert -f quickstart-compose.yaml -o quick/
    kompose.version: 1.35.0 (HEAD)
  labels:
    io.kompose.service: ai-biography-gateway
  name: ai-biography-gateway
spec:
  type: NodePort
  ports:
    - name: "8888"
      port: 8888
      targetPort: 8888
      nodePort: 30888
  selector:
    io.kompose.service: ai-biography-gateway
