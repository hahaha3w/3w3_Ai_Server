services:
  nats:
    image: nats
    container_name: nats-server
    ports:
      - "4222:4222"
      - "8222:8222"
    command: -DV
    restart: always
  consul:
    image: "consul:1.15.4"
    ports:
      - "8500:8500"
  mysql:
    image: 'mysql:8'
    ports:
      - 7428:3306
    environment:
      - MYSQL_ROOT_PASSWORD=ioTnq2Tqq8PnQoGU@UnGUzF7_8*H2Hv4KQcg-G_ho6DCDW@schgk-NLXKGM-ThWD*wq6Pt_Un-FumsTfoBzH.Bha7ztta!-yAqYi
    volumes:
      - ./init.sql:/docker-entrypoint-initdb.d/init.sql
  redis:
    image: 'redis:latest'
    command: redis-server --requirepass 12345678
  ai-biography-activity:
